apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rosa-hcp-on-helm-app-of-apps
  namespace: openshift-gitops
  labels:
    rosa-hcp-on-helm/managed: "true"
    rosa-hcp-on-helm/root: "true"
spec:
  project: default
  source:
    repoURL: https://github.com/gauravshankarcan/rosa-hcp-on-helm.git
    targetRevision: main
    path: argo/clusters
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
