apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rosa-blaziken-fail
  namespace: openshift-gitops
  labels:
    rosa-hcp-on-helm/managed: "true"
    rosa-hcp-on-helm/cluster: "blaziken-fail"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/gauravshankarcan/rosa-hcp-on-helm.git
    targetRevision: main
    path: blaziken-fail
  destination:
    server: https://kubernetes.default.svc
    namespace: open-cluster-management
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
