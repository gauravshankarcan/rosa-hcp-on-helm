---
aws_account_id: ""
rosa_hub_secrets_namespace: "rosa-hcp-secrets"
rosa_aws_secret_name_prefix: "rosa-aws-"
rosa_aws_region: "us-east-1"
# CAPA on non-AWS hubs (CRC) needs StaticIdentity + AccessKeyID/SecretAccessKey secret
rosa_capa_namespace: "multicluster-engine"
rosa_aws_static_secret_name: "rosa-aws-static-creds"
rosa_aws_static_identity_name: "rosa-static"
# Also mirror static creds into the CAPI cluster namespace (often default)
rosa_capi_namespace: "default"
# When true, also ensure OCM/ROSA creds secret referenced by CAPA exists from env
rosa_ensure_rosa_creds_secret: true
rosa_creds_secret_name: "rosa-creds-secret"
rosa_creds_secret_namespace: "multicluster-engine"
