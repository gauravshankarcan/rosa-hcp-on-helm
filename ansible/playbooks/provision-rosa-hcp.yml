---
# Provision ROSA HCP via AAP survey → AWS configure → git artifacts → Ready poll.
# Prerequisite: source ./env (or AAP credential injection) for hub access.
- name: Provision ROSA HCP cluster
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # Defaults for optional survey fields (do not self-reference extra-var names)
    cluster_type: hcp
    node_count: 3
    feature_flags: []
    force_update: false
    rosa_readiness_timeout_minutes: "{{ lookup('env', 'ROSA_READINESS_TIMEOUT_MINUTES') | default(90, true) }}"
    rosa_git_repo_path: "{{ playbook_dir }}/../.."
  pre_tasks:
    - name: "PRE | Require hub login context"
      ansible.builtin.assert:
        that:
          - lookup('env', 'KUBECONFIG') | length > 0 or lookup('env', 'OCP_CENTRAL_SERVER') | length > 0
        fail_msg: >-
          Source ./env and run scripts/hub-login.sh (or set KUBECONFIG) before provisioning.

    - name: "PRE | Reject classic in v1"
      ansible.builtin.assert:
        that:
          - cluster_type == 'hcp'
        fail_msg: "v1 supports HCP only; classic is deferred."

  roles:
    - role: rosa_hcp_secrets_namespace
    - role: rosa_capi_enable
    - role: rosa_aws_account_configure
    # Apply CAPI first so <cluster>/capi/*.yaml exists before git commit (FR-007 / T059)
    - role: rosa_apply_capi_cluster
    - role: rosa_git_commit_argo_app
    - role: rosa_cluster_readiness_poll
